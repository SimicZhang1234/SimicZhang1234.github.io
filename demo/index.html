<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archmage Gideon 6.1.3 Demo</title>
<link rel="icon" href="../img/icon.png">
<style>
/* The download page's look: one column, the film, the music in the order it plays. */
:root {
  --night: #0b0e1c;
  --marble: #eee7d7;
  --dim: #b9b2a3;
  --gold: #d9b45e;
  --line: rgba(217, 180, 94, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--night) radial-gradient(ellipse 80% 40% at 50% 0%, rgba(29, 45, 99, 0.9), transparent 70%) no-repeat;
  color: var(--marble);
  font: 400 1rem/1.7 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
main { max-width: 960px; margin-inline: auto; padding: 32px 16px 48px; text-align: center; }
h1 { margin: 0 0 4px; font: 900 clamp(1.6rem, 5vw, 2.4rem)/1.2 "Noto Serif SC", "Songti SC", "STZhongsong", "SimSun", serif; letter-spacing: 0.08em; color: var(--gold); }
.sub { margin: 0 0 24px; color: var(--dim); }
video { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; box-shadow: 0 0 0 1px #6b4f1c, 0 24px 60px rgba(0, 0, 0, 0.5); }
ol { list-style: none; margin: 24px auto 0; padding: 0; max-width: 40em; text-align: left; }
li { border-bottom: 1px solid var(--line); }
li button { all: unset; box-sizing: border-box; display: flex; gap: 16px; width: 100%; padding: 10px 4px; cursor: pointer; }
li button:hover { color: var(--gold); }
li button:focus-visible { outline: 2px solid #a6e0ff; outline-offset: 2px; }
.t { flex: 0 0 3.2em; color: var(--gold); font-variant-numeric: tabular-nums; }
.back { display: inline-block; margin-top: 28px; color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>首席法师吉迪恩 6.1.3 演示</h1>
  <p class="sub">Archmage Gideon 6.1.3: each piece of music where the game plays it · 2:40</p>
  <video id="film" src="ArchmageGideon_v6.1.3_Demo.mp4" poster="poster.jpg" width="1920" height="1080" controls preload="metadata" playsinline></video>
  <ol>
    <li><button data-t="0"><span class="t">0:00</span>战斗音乐 Battle music: Fantasy Choir (cesisco)</button></li>
    <li><button data-t="37.6"><span class="t">0:38</span>清除一波亡灵 A wave cleared: the short fanfare, then the war horns</button></li>
    <li><button data-t="49.8"><span class="t">0:50</span>血月 The Red Moon: Boss Battle #2 (nene)</button></li>
    <li><button data-t="83.2"><span class="t">1:23</span>战斗音乐 Battle music: QaziJamJam (Emma_MA)</button></li>
    <li><button data-t="101.4"><span class="t">1:41</span>巨龙降临 The dragon comes down: Epic Endgame Cinematic (cynicmusic)</button></li>
    <li><button data-t="113.3"><span class="t">1:53</span>巨龙之战 The dragon fight: the same piece throughout</button></li>
    <li><button data-t="134.4"><span class="t">2:14</span>巨龙陨落 The dragon falls: Victory Fanfare Short (cynicmusic)</button></li>
  </ol>
  <a class="back" href="../">免费下载 Free download →</a>
</main>
<script>
const film = document.getElementById("film");
for (const b of document.querySelectorAll("li button")) {
  b.addEventListener("click", () => { film.currentTime = Number(b.dataset.t); film.play(); });
}
</script>
</body>
</html>
